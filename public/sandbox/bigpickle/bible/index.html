<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bible Memory Verse</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen active">
    <div class="stars" id="stars"></div>
    <div class="setup-content">
      <h1 class="title glow-text">Bible Memory Verse</h1>
      <p class="subtitle">Learn scripture one verse at a time</p>

      <div class="selector-group">
        <label class="selector-label">Translation</label>
        <div id="translation-picker" class="translation-buttons">
          <button class="trans-btn active" data-slug="esv">ESV</button>
          <button class="trans-btn" data-slug="kjv">KJV</button>
          <button class="trans-btn" data-slug="niv">NIV</button>
          <button class="trans-btn" data-slug="nkjv">NKJV</button>
          <button class="trans-btn" data-slug="nlt">NLT</button>
        </div>
      </div>

      <div class="selector-group">
        <label class="selector-label">Book</label>
        <div class="dropdown-wrapper">
          <input type="text" id="book-search" class="search-input" placeholder="Select a book..." autocomplete="off">
          <div id="book-dropdown" class="dropdown-list hidden"></div>
        </div>
      </div>

      <div class="selector-row">
        <div class="selector-group flex-1">
          <label class="selector-label">Chapter</label>
          <div class="dropdown-wrapper">
            <input type="text" id="chapter-search" class="search-input" placeholder="--" autocomplete="off" disabled>
            <div id="chapter-dropdown" class="dropdown-list hidden"></div>
          </div>
        </div>
        <div class="selector-group flex-1">
          <label class="selector-label">Verse</label>
          <div class="dropdown-wrapper">
            <input type="text" id="verse-search" class="search-input" placeholder="--" autocomplete="off" disabled>
            <div id="verse-dropdown" class="dropdown-list hidden"></div>
          </div>
        </div>
      </div>

      <div class="verse-nav-row">
        <button id="prev-verse-btn" class="nav-arrow-btn">◀</button>
        <div class="verse-preview" id="verse-preview"></div>
        <button id="next-verse-setup-btn" class="nav-arrow-btn">▶</button>
      </div>

      <div class="selector-group">
        <label class="selector-label">Word Spread</label>
        <div class="spread-row">
          <input type="range" id="spread-slider" class="spread-slider" min="1" max="5" step="0.5" value="1">
          <span class="spread-value" id="spread-value">1x</span>
        </div>
      </div>

      <div class="selector-group">
        <div class="selector-row" style="align-items: center;">
          <label class="selector-label" style="margin-bottom:0; flex:1;">Any Order</label>
          <label class="toggle-switch">
            <input type="checkbox" id="any-order-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="selector-group">
        <label class="selector-label">Auto-Complete Speed</label>
        <div id="speed-picker" class="speed-buttons">
          <button class="speed-btn" data-speed="slow">Slow</button>
          <button class="speed-btn active" data-speed="normal">Normal</button>
          <button class="speed-btn" data-speed="fast">Fast</button>
        </div>
      </div>

      <button id="start-btn" class="start-btn glow-btn" disabled>Start Game</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div class="game-header">
      <div class="verse-ref" id="verse-ref"></div>
      <div class="verse-slots" id="verse-slots"></div>
      <button id="auto-btn" class="auto-btn">Auto</button>
      <button id="back-btn" class="back-btn">✕</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="celebration-overlay" class="celebration-overlay hidden">
      <div class="celebration-text glow-text">Well Done!</div>
      <div class="celebration-verse" id="celebration-verse"></div>
      <button id="next-verse-btn" class="start-btn glow-btn">Next Verse</button>
    </div>
  </div>

  <canvas id="particle-canvas"></canvas>

  <script src="js/api.js?v=3"></script>
  <script src="js/setup.js?v=3"></script>
  <script src="js/game.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
