<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower Defense</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
body { background: #111; font-family: Arial, sans-serif; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
#topBar { background: #1a1a1a; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; z-index: 10; }
.stat { font-size: 18px; font-weight: bold; background: #222; padding: 4px 10px; border-radius: 4px; }
#waveBtn { background: #2a6a2a; color: #fff; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-size: 14px; font-weight: bold; }
#waveBtn:disabled { background: #555; }
#towerPanel { background: #1a1a1a; padding: 8px; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.tower-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 10px; cursor: pointer; border-radius: 6px; font-size: 12px; text-align: center; min-width: 70px; }
.tower-btn.selected { border-color: #0f0; background: #1a3a1a; }
.tower-btn.sell-mode { border-color: #f44; background: #3a1a1a; }
#canvasWrap { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
canvas { display: block; max-width: 100%; max-height: 100%; }
#gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 30px; border-radius: 12px; text-align: center; z-index: 20; }
#gameOver h2 { color: #f44; margin-bottom: 10px; }
#gameOver button { background: #2a6a2a; color: #fff; border: none; padding: 12px 24px; cursor: pointer; border-radius: 4px; font-size: 16px; }
</style>
</head>
<body>
<div id="topBar">
  <span class="stat" style="color:#ffd700;">💰 <span id="gold">150</span></span>
  <span class="stat">❤️ <span id="lives">25</span></span>
  <span class="stat">🌊 <span id="wave">0</span></span>
  <span class="stat">💀 <span id="score">0</span></span>
  <button id="waveBtn" onclick="startWave()">Start Wave 1</button>
  <button onclick="restartGame()" style="background:#a33;color:#fff;border:none;padding:8px 16px;cursor:pointer;border-radius:4px;font-size:14px;font-weight:bold;">🔄 Restart</button>
</div>
<div id="towerPanel">
  <button class="tower-btn selected" onclick="selectTower(0)">🏹 Arrow<br>$20</button>
  <button class="tower-btn" onclick="selectTower(1)">❄️ Ice<br>$40</button>
  <button class="tower-btn" onclick="selectTower(2)">💥 Cannon<br>$60</button>
  <button class="tower-btn" onclick="selectTower(3)">⚡ Tesla<br>$85</button>
  <button class="tower-btn" id="sellBtn" onclick="toggleSellMode()">🗑️ Sell<br>Mode</button>
</div>
<div id="canvasWrap">
  <canvas id="game"></canvas>
  <div id="gameOver">
    <h2>Game Over!</h2>
    <p>Score: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const CELL = 40;
const COLS = 20;
const ROWS = 14;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

let gold = 150, lives = 25, score = 0, waveNum = 0, waveActive = false;
let selectedTower = 0;
let sellMode = false;
let towers = [], enemies = [], projectiles = [], particles = [];

const PATH = [
  {x:0,y:3},{x:1,y:3},{x:2,y:3},{x:3,y:3},{x:4,y:3},{x:5,y:3},{x:6,y:3},
  {x:6,y:4},{x:6,y:5},{x:6,y:6},{x:6,y:7},
  {x:7,y:7},{x:8,y:7},{x:9,y:7},{x:10,y:7},{x:11,y:7},{x:12,y:7},
  {x:12,y:6},{x:12,y:5},{x:12,y:4},{x:12,y:3},{x:12,y:2},{x:12,y:1},
  {x:13,y:1},{x:14,y:1},{x:15,y:1},{x:16,y:1},
  {x:16,y:2},{x:16,y:3},{x:16,y:4},{x:16,y:5},{x:16,y:6},{x:16,y:7},{x:16,y:8},{x:16,y:9},{x:16,y:10},
  {x:17,y:10},{x:18,y:10},{x:19,y:10}
];

const TOWER_TYPES = [
  { name:'Arrow', cost:20, range:3, damage:10, fireRate:28, color:'#0f0', projColor:'#0f0', projSpeed:6, splash:0 },
  { name:'Ice', cost:40, range:2.5, damage:5, fireRate:40, color:'#0cf', projColor:'#0cf', projSpeed:5, splash:0, slow:0.5 },
  { name:'Cannon', cost:60, range:2.5, damage:30, fireRate:75, color:'#f80', projColor:'#f00', projSpeed:4, splash:1.5 },
  { name:'Tesla', cost:85, range:2, damage:18, fireRate:45, color:'#a0f', projColor:'#a0f', projSpeed:10, splash:0, chain:3 }
];

const WAVES = [
  { count:7, hp:25, speed:0.8, reward:9 },
  { count:10, hp:35, speed:0.9, reward:10 },
  { count:12, hp:45, speed:1, reward:12 },
  { count:15, hp:60, speed:1, reward:13 },
  { count:18, hp:75, speed:1.1, reward:14 },
  { count:20, hp:90, speed:1.1, reward:15 },
  { count:24, hp:110, speed:1.2, reward:16 },
  { count:28, hp:130, speed:1.2, reward:18 },
  { count:32, hp:155, speed:1.3, reward:20 },
  { count:35, hp:180, speed:1.3, reward:22 },
];

let enemiesSpawned = 0, spawnTimer = 0;
let currentWaveData = null;

function isPath(col, row) {
  return PATH.some(p => p.x === col && p.y === row);
}

function hasTower(col, row) {
  return towers.some(t => t.col === col && t.row === row);
}

function toggleSellMode() {
  sellMode = !sellMode;
  document.getElementById('sellBtn').classList.toggle('sell-mode', sellMode);
  if (sellMode) {
    document.querySelectorAll('.tower-btn:not(#sellBtn)').forEach(b => b.classList.remove('selected'));
  } else {
    document.querySelectorAll('.tower-btn')[selectedTower].classList.add('selected');
  }
}

function handleCanvasClick(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const col = Math.floor((clientX - rect.left) * scaleX / CELL);
  const row = Math.floor((clientY - rect.top) * scaleY / CELL);

  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

  if (sellMode) {
    const idx = towers.findIndex(t => t.col === col && t.row === row);
    if (idx !== -1) {
      const t = towers[idx];
      const refund = Math.floor(t.cost * 0.6);
      gold += refund;
      spawnParticles(t.col * CELL + CELL/2, t.row * CELL + CELL/2, '#ff0', 8);
      towers.splice(idx, 1);
      updateUI();
    }
    return;
  }

  if (isPath(col, row) || hasTower(col, row)) return;

  const type = TOWER_TYPES[selectedTower];
  if (gold >= type.cost) {
    gold -= type.cost;
    towers.push({ col, row, ...type, cooldown: 0, level: 1 });
    updateUI();
  }
}

canvas.addEventListener('click', handleCanvasClick);
canvas.addEventListener('touchend', handleCanvasClick);

function selectTower(i) {
  selectedTower = i;
  sellMode = false;
  document.getElementById('sellBtn').classList.remove('sell-mode');
  document.querySelectorAll('.tower-btn').forEach((btn, idx) => {
    btn.classList.toggle('selected', idx === i);
  });
}

function spawnEnemy() {
  const w = currentWaveData;
  enemies.push({
    pathIdx: 0,
    x: PATH[0].x * CELL + CELL/2,
    y: PATH[0].y * CELL + CELL/2,
    hp: w.hp, maxHp: w.hp,
    speed: w.speed, reward: w.reward,
    slowTimer: 0
  });
}

function startWave() {
  if (waveActive) return;
  waveNum++;
  const wIdx = Math.min(waveNum - 1, WAVES.length - 1);
  const scaling = waveNum > WAVES.length ? 1 + (waveNum - WAVES.length) * 0.2 : 1;
  currentWaveData = { ...WAVES[wIdx], hp: Math.floor(WAVES[wIdx].hp * scaling) };
  enemiesSpawned = 0;
  spawnTimer = 0;
  waveActive = true;
  document.getElementById('waveBtn').disabled = true;
  updateUI();
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 20 + Math.random() * 15,
      color, size: 2 + Math.random() * 3
    });
  }
}

function findTarget(tower) {
  let closest = null, minDist = Infinity;
  const tx = tower.col * CELL + CELL/2;
  const ty = tower.row * CELL + CELL/2;
  const range = tower.range * CELL;

  for (const e of enemies) {
    const dx = e.x - tx, dy = e.y - ty;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist <= range && e.pathIdx < PATH.length) {
      if (dist < minDist) { minDist = dist; closest = e; }
    }
  }
  return closest;
}

function fireTower(tower) {
  const target = findTarget(tower);
  if (!target) return;

  const tx = tower.col * CELL + CELL/2;
  const ty = tower.row * CELL + CELL/2;
  const dx = target.x - tx, dy = target.y - ty;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const speed = tower.projSpeed;

  projectiles.push({
    x: tx, y: ty,
    vx: (dx/dist)*speed, vy: (dy/dist)*speed,
    damage: tower.damage,
    color: tower.projColor,
    splash: tower.splash || 0,
    slow: tower.slow || 0,
    chain: tower.chain || 0,
    chainTargets: [],
    life: 60
  });
}

function update() {
  if (waveActive && enemiesSpawned < currentWaveData.count) {
    spawnTimer++;
    if (spawnTimer >= 25) {
      spawnEnemy();
      enemiesSpawned++;
      spawnTimer = 0;
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.pathIdx >= PATH.length - 1) {
      lives--;
      spawnParticles(e.x, e.y, '#f00', 8);
      enemies.splice(i, 1);
      updateUI();
      if (lives <= 0) { endGame(); return; }
      continue;
    }

    const target = PATH[e.pathIdx + 1];
    const tx = target.x * CELL + CELL/2;
    const ty = target.y * CELL + CELL/2;
    const dx = tx - e.x, dy = ty - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const spd = e.slowTimer > 0 ? e.speed * 0.5 : e.speed;
    if (e.slowTimer > 0) e.slowTimer--;

    if (dist < spd * 2) {
      e.pathIdx++;
      e.x = tx; e.y = ty;
    } else {
      e.x += (dx/dist) * spd * 2;
      e.y += (dy/dist) * spd * 2;
    }
  }

  for (const t of towers) {
    t.cooldown--;
    if (t.cooldown <= 0) {
      fireTower(t);
      t.cooldown = t.fireRate;
    }
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx; p.y += p.vy;
    p.life--;

    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const dx = e.x - p.x, dy = e.y - p.y;
      if (Math.sqrt(dx*dx + dy*dy) < 15) {
        e.hp -= p.damage;
        if (p.slow > 0) e.slowTimer = 60;

        if (p.chain > 0 && p.chainTargets.length < p.chain) {
          p.chainTargets.push(e);
          let nextTarget = null, minD = Infinity;
          for (const ne of enemies) {
            if (p.chainTargets.includes(ne)) continue;
            const cdx = ne.x - e.x, cdy = ne.y - e.y;
            const cd = Math.sqrt(cdx*cdx + cdy*cdy);
            if (cd < minD && cd < 120) { minD = cd; nextTarget = ne; }
          }
          if (nextTarget) {
            nextTarget.hp -= p.damage * 0.6;
            p.chainTargets.push(nextTarget);
            spawnParticles(nextTarget.x, nextTarget.y, p.color, 3);
          }
        }

        if (p.splash > 0) {
          for (const ae of enemies) {
            if (ae === e) continue;
            const sdx = ae.x - p.x, sdy = ae.y - p.y;
            if (Math.sqrt(sdx*sdx + sdy*sdy) < p.splash * CELL) {
              ae.hp -= p.damage * 0.5;
            }
          }
          spawnParticles(p.x, p.y, '#f80', 12);
        }

        spawnParticles(e.x, e.y, p.color, 4);
        if (e.hp <= 0) {
          gold += e.reward;
          score += e.reward;
          spawnParticles(e.x, e.y, '#ff0', 10);
          enemies.splice(j, 1);
        }
        hit = true;
        break;
      }
    }
    if (hit || p.life <= 0) {
      projectiles.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (waveActive && enemiesSpawned >= currentWaveData.count && enemies.length === 0) {
    waveActive = false;
    document.getElementById('waveBtn').disabled = false;
    document.getElementById('waveBtn').textContent = `Start Wave ${waveNum + 1}`;
    gold += 20;
    updateUI();
  }

  updateUI();
}

function draw() {
  ctx.fillStyle = '#1a2a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const p of PATH) {
    ctx.fillStyle = '#3a3020';
    ctx.fillRect(p.x * CELL, p.y * CELL, CELL, CELL);
    ctx.strokeStyle = '#4a4030';
    ctx.strokeRect(p.x * CELL, p.y * CELL, CELL, CELL);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(canvas.width, y*CELL); ctx.stroke();
  }

  for (const t of towers) {
    const cx = t.col * CELL + CELL/2;
    const cy = t.row * CELL + CELL/2;

    ctx.beginPath();
    ctx.arc(cx, cy, t.range * CELL, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fill();

    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
    ctx.fill();

    if (t.cooldown > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(cx, cy, 16, -Math.PI/2, -Math.PI/2 + (t.cooldown / t.fireRate) * Math.PI * 2);
      ctx.stroke();
    }
  }

  for (const e of enemies) {
    const hpPct = e.hp / e.maxHp;
    ctx.fillStyle = e.slowTimer > 0 ? '#4af' : '#f44';
    ctx.beginPath();
    ctx.arc(e.x, e.y, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#200';
    ctx.beginPath();
    ctx.arc(e.x, e.y, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#400';
    ctx.fillRect(e.x - 12, e.y - 18, 24, 4);
    ctx.fillStyle = hpPct > 0.5 ? '#0f0' : hpPct > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(e.x - 12, e.y - 18, 24 * hpPct, 4);
  }

  for (const p of projectiles) {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const p of particles) {
    ctx.globalAlpha = p.life / 35;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#0f0';
  ctx.font = '12px Arial';
  ctx.fillText('START', PATH[0].x * CELL + 2, PATH[0].y * CELL + 24);
  ctx.fillStyle = '#f00';
  ctx.fillText('END', PATH[PATH.length-1].x * CELL + 5, PATH[PATH.length-1].y * CELL + 24);
}

function updateUI() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('lives').textContent = lives;
  document.getElementById('wave').textContent = waveNum;
  document.getElementById('score').textContent = score;
}

function endGame() {
  document.getElementById('gameOver').style.display = 'block';
  document.getElementById('finalScore').textContent = score;
}

function restartGame() {
  gold = 150; lives = 25; score = 0; waveNum = 0;
  towers = []; enemies = []; projectiles = []; particles = [];
  waveActive = false; sellMode = false;
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('waveBtn').disabled = false;
  document.getElementById('waveBtn').textContent = 'Start Wave 1';
  document.getElementById('sellBtn').classList.remove('sell-mode');
  selectTower(0);
  updateUI();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();
</script>
</body>
</html>
